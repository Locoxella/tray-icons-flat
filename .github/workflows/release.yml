name: Release & Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Optional manual version override (e.g. 1.0.0)'
        required: false
        default: ''

permissions:
  contents: write
  id-token: write

jobs:
  build-and-verify:
    name: 📦 Build & Verify Distribution
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.version.outputs.semver }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: '6.x'

      - name: Determine Version via GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.7.0
        with:
          configFilePath: GitVersion.yml

      - name: Resolve Effective Version
        id: version
        run: |
          MANUAL_VER="${{ github.event.inputs.version_override }}"
          GIT_VER="${{ steps.gitversion.outputs.semVer }}"
          if [ -n "$MANUAL_VER" ]; then
            EFFECTIVE_VER="$MANUAL_VER"
          elif [ -n "$GIT_VER" ]; then
            EFFECTIVE_VER="$GIT_VER"
          else
            EFFECTIVE_VER="1.0.0"
          fi
          echo "semver=$EFFECTIVE_VER" >> $GITHUB_OUTPUT
          echo "Effective release version: $EFFECTIVE_VER"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Packaging Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel twine

      - name: Inject Version into pyproject.toml & setup.py
        run: |
          VER="${{ steps.version.outputs.semver }}"
          sed -i "s/version = \".*\"/version = \"$VER\"/" pyproject.toml
          sed -i "s/version=\".*\"/version=\"$VER\"/" setup.py

      - name: Build Wheel & Source Distribution
        run: python -m build

      - name: Validate Metadata with Twine
        run: twine check dist/*

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: pypi-dist-${{ steps.version.outputs.semver }}
          path: dist/*
          retention-days: 7

  publish-pypi:
    name: 🚀 Publish to PyPI (Trusted Publisher)
    needs: [build-and-verify]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tray-icons-flat
    steps:
      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          name: pypi-dist-${{ needs.build-and-verify.outputs.semver }}
          path: dist/

      - name: Publish Package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ needs.build-and-verify.outputs.semver }}
          tag_name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true

  release-summary:
    name: 📊 Release Execution Summary
    needs: [build-and-verify, publish-pypi]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate Release Summary
        run: |
          BUILD_STATUS="${{ needs.build-and-verify.result }}"
          PUBLISH_STATUS="${{ needs.publish-pypi.result }}"
          SEMVER="${{ needs.build-and-verify.outputs.semver }}"

          if [ "$BUILD_STATUS" = "success" ]; then BUILD_ICON="✅"; else BUILD_ICON="❌"; fi
          if [ "$PUBLISH_STATUS" = "success" ]; then PUB_ICON="✅"; else PUB_ICON="❌"; fi

          OVERALL_STATUS="Successful"
          if [ "$BUILD_STATUS" != "success" ] || [ "$PUBLISH_STATUS" != "success" ]; then
            OVERALL_STATUS="Failed"
          fi

          cat << EOF_SUMMARY >> $GITHUB_STEP_SUMMARY
          # 🚀 Release & PyPI Publishing Summary

          > **TL;DR:** Release execution status: **$OVERALL_STATUS** (Version: \`v$SEMVER\`)

          ### 📋 Pipeline Health Overview

          | Stage | Status | Details |
          | :--- | :---: | :--- |
          | **Build & Packaging** | $BUILD_ICON \`$BUILD_STATUS\` | Source tarball & Wheel verified with Twine |
          | **PyPI Publishing** | $PUB_ICON \`$PUBLISH_STATUS\` | OIDC Trusted Publishing to PyPI |

          ### 🌐 Available Package Links
          - **PyPI Page:** [https://pypi.org/project/tray-icons-flat/](https://pypi.org/project/tray-icons-flat/)
          - **Install via pipx:**
            \`\`\`bash
            pipx install tray-icons-flat==$SEMVER
            \`\`\`
          - **Run on-demand:**
            \`\`\`bash
            pipx run tray-icons-flat scan
            \`\`\`

          ---
          ### 💡 Quick Notes & Review Guidelines
          - **Trusted Publisher:** Authentication handled securely via PyPI OpenID Connect (OIDC) without long-lived API tokens.
          - **Provenance:** Build metadata and package contents are cryptographically bound to the GitHub Actions execution.
          EOF_SUMMARY
